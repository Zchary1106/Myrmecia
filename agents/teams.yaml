# Myrmecia — Agent Teams
#
# A "team" is a named squad of specialist agents with a lead (the orchestrator)
# and a coordination strategy. Teams are how you put the colony to work as a
# unit: address one with `@team-id <task>` in the CLI and the lead routes the
# work across the team's members.
#
# This file is the canonical spec. The CLI currently embeds the same roster
# (dependency-free); the server/dashboard will read this file when the
# `/api/v1/teams` endpoint lands. Each team maps to an existing pipeline
# template (templates/*.yaml) so no orchestration code is duplicated.
#
# Fields:
#   id        short handle used as `@id` in the CLI
#   name      display name
#   emoji     glyph shown in listings
#   lead      the coordinating agent (orchestrator/master)
#   members   member roles (must exist in agents/registry.yaml)
#   template  the pipeline template `name` this team runs (templates/*.yaml)
#   triggers  keywords that hint this team for a plain-language task
#   blurb     one-line description

teams:
  - id: feature
    name: Feature Team
    emoji: "🛠️"
    lead: master
    members: [product-manager, designer, developer, tester, devops]
    template: Full Product
    triggers: [feature, build, add, implement, ship, product]
    blurb: Ship a feature end-to-end — spec, design, code, test, deploy.

  - id: bugfix
    name: Bugfix Team
    emoji: "🐛"
    lead: master
    members: [issue-refiner, developer, tester, reviewer, gitops]
    template: Bugfix
    triggers: [bug, fix, broken, error, crash, regression, hotfix]
    blurb: Refine the issue, implement the fix, test it, review the diff, and check CI readiness.

  - id: quality
    name: Quality Team
    emoji: "🔍"
    lead: master
    members: [accessibility-tester, react-dashboard-auditor, performance-investigator, release-notes]
    template: Product Quality
    triggers: [audit, accessibility, performance, quality, a11y, lighthouse]
    blurb: Audit accessibility, UI, and performance, then summarize.

  - id: release
    name: Release & Security Team
    emoji: "🔒"
    lead: master
    members: [issue-refiner, qa-automation, security-reviewer, gitops, release-compliance]
    template: Release Compliance
    triggers: [release, security, compliance, gate, audit, vulnerability]
    blurb: Refine, test, security-audit, and gate a release.

  - id: content
    name: WeChat Content Team
    emoji: "✍️"
    contractVersion: 2
    lead: coordinator
    members: [product-manager, wechat-writer, reviewer]
    roles:
      - slot: coordinator
        agentId: master
      - slot: creator
        agentId: content-creator
        skills: [wechat-longform-writing, wechat-html-layout]
      - slot: reviewer
        agentId: review
        skills: [social-compliance, review-package-preparation]
      - slot: operator
        agentId: ops
        skills: [social-publish-preflight, social-publishing]
        tools: [mcp__wechat-official-account__wechat_publish]
    policy:
      requireHumanApprovalBefore: [publish]
    template: WeChat Article
    triggers: [article, post, blog, write, 公众号, 文章, content]
    blurb: Plan, write, lay out, and review long-form WeChat content.

  - id: xiaohongshu
    name: Xiaohongshu Team
    emoji: "📕"
    contractVersion: 2
    lead: coordinator
    members: [trend-scout, xiaohongshu-writer, social-compliance-reviewer, social-review-coordinator, xiaohongshu-visual-designer, media-qa, social-preflight, social-publisher]
    roles:
      - slot: coordinator
        agentId: master
      - slot: researcher
        agentId: researcher
        skills: [social-trend-evidence, competitive-research]
        tools: [web.search, web.fetch, mcp__douyin-search__search_videos]
      - slot: creator
        agentId: content-creator
        skills: [xiaohongshu-copywriting, hashtag-planning]
      - slot: designer
        agentId: ui
        skills: [xiaohongshu-card-design, social-image-generation]
      - slot: reviewer
        agentId: review
        skills: [social-compliance, review-package-preparation]
      - slot: media-qa
        agentId: qa
        skills: [media-quality-check]
      - slot: operator
        agentId: ops
        skills: [social-publish-preflight, social-publishing]
        tools: [mcp__xiaohongshu__publish_content, mcp__xiaohongshu__publish_with_video]
    policy:
      requireHumanApprovalBefore: [publish]
    template: Xiaohongshu Publish
    triggers: [小红书, rednote, 笔记, 图文, 卡片, 种草]
    blurb: Research, write, illustrate, review, and publish a human-approved Xiaohongshu note.

  - id: douyin
    name: Douyin Video Team
    emoji: "🎬"
    contractVersion: 2
    lead: coordinator
    members: [trend-scout, douyin-writer, social-compliance-reviewer, social-review-coordinator, media-qa, social-preflight, social-publisher, social-ops, social-analytics]
    roles:
      - slot: coordinator
        agentId: master
      - slot: researcher
        agentId: researcher
        skills: [social-trend-evidence, competitive-research]
        tools: [web.search, web.fetch, mcp__douyin-search__search_videos]
      - slot: creator
        agentId: content-creator
        skills: [douyin-hook-script, shot-list-design]
      - slot: reviewer
        agentId: review
        skills: [social-compliance, review-package-preparation]
      - slot: media-qa
        agentId: qa
        skills: [media-quality-check]
      - slot: operator
        agentId: ops
        skills: [social-publish-preflight, social-publishing]
        tools: [mcp__douyin-upload__douyin_upload_video]
    policy:
      requireHumanApprovalBefore: [publish]
    template: Douyin Video Publish
    triggers: [抖音, douyin, 视频, 分镜, 口播, 短视频]
    blurb: Research and script a Douyin video, validate the supplied media, and publish only after approval.

  - id: social-three-lanes
    name: Social Three-Lane Team
    emoji: "📣"
    contractVersion: 2
    lead: coordinator
    members: [trend-scout, content-strategist, douyin-writer, xiaohongshu-writer, wechat-writer, social-compliance-reviewer, social-review-coordinator, media-qa, social-preflight, social-publisher, social-ops, social-analytics]
    roles:
      - slot: coordinator
        agentId: master
      - slot: researcher
        agentId: researcher
        skills: [social-trend-evidence, competitive-research]
        tools: [web.search, web.fetch, mcp__douyin-search__search_videos]
      - slot: strategist
        agentId: pm
        skills: [content-core-planning, cross-platform-adaptation]
      - slot: douyin-creator
        agentId: content-creator
        skills: [douyin-hook-script, shot-list-design]
      - slot: xiaohongshu-creator
        agentId: content-creator
        skills: [xiaohongshu-copywriting, hashtag-planning]
      - slot: wechat-creator
        agentId: content-creator
        skills: [wechat-longform-writing, wechat-html-layout]
      - slot: designer
        agentId: ui
        skills: [xiaohongshu-card-design, social-image-generation]
      - slot: reviewer
        agentId: review
        skills: [social-compliance, review-package-preparation]
      - slot: media-qa
        agentId: qa
        skills: [media-quality-check]
      - slot: operator
        agentId: ops
        skills: [social-publish-preflight, social-publishing]
        tools: [mcp__xiaohongshu__publish_content, mcp__xiaohongshu__publish_with_video, mcp__douyin-upload__douyin_upload_video, mcp__wechat-official-account__wechat_publish]
    policy:
      requireHumanApprovalBefore: [publish]
    template: Social Content Three Lanes
    triggers: [三平台, 全平台, 小红书抖音公众号, 社媒矩阵, 内容矩阵]
    blurb: Share research and a content core, then run independent Douyin, Xiaohongshu, and WeChat production lanes.
