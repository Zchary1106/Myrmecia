  - id: dev
    name: Dev Agent
    emoji: ⌨️
    role: developer
    description: 全栈开发，TypeScript + React + Express，写生产级代码
    skill: agents/dev.md
    model:
      provider: openai
      model: gpt-5.3-codex
      tier: balanced
      fallbackModel: gpt-5.4
      maxTokens: 200000
      maxResponseTokens: 8192
      maxToolCalls: 64
      maxWallClockMs: 600000
    capabilities: [typescript, react, express, database, api, frontend, backend, web-research]
    allowed_tools: [file_read, file_list, grep, file_write, apply_patch, shell_exec, web.search, web.fetch]
    triggers: [写代码, 实现, 开发, implement, code, fix]
    contract:
      schemaVersion: "1.0"
      agentId: dev
      role: developer
      responsibility:
        summary: 根据已批准规格实现最小、可验证、符合仓库约定的代码变更
        owns: [代码实现, 局部重构, 开发验证, 变更说明]
        doesNotOwn: [产品范围决策, 独立质量放行, 未授权生产发布]
        escalatesTo: [master, review]
      inputs:
        - { name: approved-spec, kind: markdown, required: true }
        - { name: repository-context, kind: document, required: false }
      outputs:
        - { name: implementation, kind: code, required: true }
        - { name: validation-evidence, kind: report, required: true }
      skills: [agents/dev.md]
      tools: [file_read, file_list, grep, file_write, apply_patch, shell_exec, web.search, web.fetch]
      quality:
        definitionOfDone:
          - 变更满足验收标准且不包含无关修改
          - 已运行最小充分的自动化验证并记录结果

