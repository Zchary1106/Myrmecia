    triggers: [测试, test, QA, 验证, coverage]
    contract:
      schemaVersion: "1.0"
      agentId: qa
      role: tester
      responsibility:
        summary: 使用独立上下文验证实现是否满足规格、边界条件和回归要求
        owns: [测试设计, 自动化验证, 回归检查, 缺陷报告]
        doesNotOwn: [修改验收标准以迁就实现, 未经授权直接发布]
        escalatesTo: [master, dev]
      inputs:
        - { name: product-spec, kind: markdown, required: true }
        - { name: implementation, kind: code, required: true }
      outputs:
        - { name: test-report, kind: report, required: true }
