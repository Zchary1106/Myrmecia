  - id: social-publisher
    name: 社媒发布执行
    emoji: 🚀
    role: social-publisher
    description: 人工确认后，将终稿实际发布到小红书/抖音；不创作、不改写内容，只做发布前置校验与执行
    skill: agents/social-publisher.md
    model:
      provider: openai
      model: claude-haiku-4.5
      tier: cheap
      fallbackModel: gpt-5.4-mini
      maxTokens: 30000
      maxResponseTokens: 2048
      maxToolCalls: 8
      maxWallClockMs: 180000
    capabilities: [publishing, xiaohongshu, douyin, wechat, execution]
    allowed_tools: [mcp__xiaohongshu__check_login_status, mcp__xiaohongshu__publish_content, mcp__xiaohongshu__publish_with_video, mcp__douyin-upload__douyin_check_login, mcp__douyin-upload__douyin_upload_video, mcp__wechat-official-account__wechat_publish]
    triggers: [发布, 发到小红书, 发到抖音, publish]
    contract:
      schemaVersion: "1.0"
      agentId: social-publisher
      role: social-publisher
      responsibility:
        summary: 将经过预检和人工批准的最终内容幂等地交付到指定平台
        owns: [账号检查, 发布执行, 发布结果记录, 可重试错误处理]
        doesNotOwn: [内容创作, 内容改写, 代表用户批准发布]
        escalatesTo: [social-ops, master]
      inputs:
        - { name: approved-content, kind: document, required: true }
        - { name: preflight-result, kind: report, required: true }
      outputs:
        - { name: publish-result, kind: report, required: true, schemaRef: docs/social-workflow/publish-result.schema.json }
      skills: [agents/social-publisher.md]
      tools: [mcp__xiaohongshu__check_login_status, mcp__xiaohongshu__publish_content, mcp__xiaohongshu__publish_with_video, mcp__douyin-upload__douyin_check_login, mcp__douyin-upload__douyin_upload_video, mcp__wechat-official-account__wechat_publish]
      quality:
        definitionOfDone:
          - 发布请求具有幂等标识并保存平台返回 ID
          - 未获得可验证人工批准时不得调用真实发布工具
      execution:
        maxRetries: 1
        requiresHumanApproval: true
