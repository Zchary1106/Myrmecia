# Agent Registry — 默认 Agent 列表
# 所有 Agent 均支持动态注册/注销，此文件为预置配置

agents:
  # ===== 核心开发 Agent =====
  - id: master
    name: Master Agent
    emoji: 🧠
    role: orchestrator
    description: 任务分解与调度，自动将复杂需求拆解为子任务并分配给专业 Agent
    skill: agents/master.md
    model:
      provider: openai
      model: gpt-5.5
      tier: strong
      fallbackModel: gpt-5.4
      maxTokens: 16384
      maxResponseTokens: 8192
      maxToolCalls: 40
      maxWallClockMs: 300000
    capabilities: [planning, decomposition, coordination, review, web-research]
    allowed_tools: [web.search, web.fetch]
    triggers: [自动分配, 帮我做, build me, create a]
    contract:
      schemaVersion: "1.0"
      agentId: master
      role: orchestrator
      responsibility:
        summary: 将用户目标标准化，选择团队并协调结构化产物的流转与验收
        owns: [需求分解, 团队选择, 工作流协调, 风险升级]
        doesNotOwn: [直接实现全部子任务, 代替人工批准高风险操作]
      inputs:
        - { name: user-goal, kind: text, required: true }
      outputs:
        - { name: execution-plan, kind: json, required: true }
      skills: [agents/master.md]
      tools: [web.search, web.fetch]
      quality:
        definitionOfDone:
          - 每个子任务都有负责人、输入、输出和完成条件
          - 高风险操作包含明确的人工批准节点

  - id: pm
    name: PM Agent
    emoji: 🎯
    role: product-manager
    description: 需求分析、PRD 编写、用户故事、验收标准
    skill: agents/pm.md
    model:
      provider: openai
      model: gpt-5.4-mini
      tier: cheap
      fallbackModel: claude-haiku-4.5
      maxTokens: 120000
      maxResponseTokens: 8192
      maxToolCalls: 24
      maxWallClockMs: 600000
    capabilities: [spec, user-stories, requirements, acceptance-criteria, web-research]
    allowed_tools: [web.search, web.fetch, content.hashtag_plan]
    triggers: [需求, spec, PRD, 用户故事, requirement]
    contract:
      schemaVersion: "1.0"
      agentId: pm
      role: product-manager
      responsibility:
        summary: 把模糊需求转化为可实现、可验收的产品规格
        owns: [需求澄清, 用户故事, 验收标准, 范围界定]
        doesNotOwn: [生产代码实现, 最终发布审批]
        escalatesTo: [master]
      inputs:
        - { name: user-goal, kind: text, required: true }
      outputs:
        - { name: product-spec, kind: markdown, required: true }
      skills: [agents/pm.md]
      tools: [web.search, web.fetch, content.hashtag_plan]
      quality:
        definitionOfDone:
          - 需求范围、非目标和验收标准明确
          - 风险、依赖和待确认项可追踪

