name: Xiaohongshu Douyin Crosspost
description: >-
  知识科普/生活好物/工作方法内容的小红书+抖音双平台工作流：真实数据选题调研 → 小红书图文创作 → 抖音脚本创作 →
  合规审核 → 人工确认 → 实际发布。创建该流水线时建议将 gateMode 设为 "manual"，
  这样每个阶段结束后都会暂停等待人工点击 approve，尤其是发布执行阶段之前必须人工确认终稿。
stages:
  - name: 选题调研
    role: trend-scout
    prompt_template: |
      围绕以下主题，调研两个平台的真实热度数据。
      抖音侧用 `mcp__douyin-search__search_videos` / `get_homefeed` 抓真实数据；
      小红书侧用 `web.search` 检索公开信息（站内搜索接口过慢且会被 DLP 拦截，未授予本 Agent）。
      不要凭空猜测热度数字。总工具调用控制在 8 次以内，不要对同一关键词反复重试。
      内容方向限定为：知识科普 / 生活好物 / 工作方法与效率。

      输出：推荐的具体选题角度、热度证据（真实标题+互动数据，并标注数据来源）、
      小红书和抖音各自的差异化建议、关键词清单。

      主题：
      {input}

  - name: 小红书笔记创作
    role: xiaohongshu-writer
    prompt_template: |
      根据以下选题调研结果，创作完整的小红书图文笔记（标题、正文、配图方案、标签、发布建议）。

      选题调研结果：
      {input}

  - name: 抖音脚本创作
    role: douyin-writer
    prompt_template: |
      下面是同一批调研之后创作的小红书图文笔记完整初稿。请你：
      1. 在回答最前面，先原样完整复述一遍这份小红书笔记初稿（标题、正文、标签，不要删减或改写），
         标注小标题"【小红书笔记初稿（原样保留）】"——因为下一步"合规审核" Agent 只能看到你这一步
         的完整输出，看不到更早的草稿，如果你不带上，审核就会因为缺内容而卡住。
      2. 然后基于同样的核心观点，创作完整的抖音短视频脚本（标题、分镜脚本、口播稿、封面文案、
         标签、发布建议），表达形式按抖音平台习惯调整，标注小标题"【抖音脚本创作】"。

      小红书笔记初稿：
      {input}

  - name: 合规审核
    role: review
    prompt_template: |
      审核以下小红书笔记初稿和抖音脚本初稿，检查：
      1. 事实准确性、逻辑连贯性
      2. AI 痕迹（套话、模板感）
      3. 敏感内容 / 广告法风险 / 平台社区规范风险（虚假宣传、极限词、导流私域等）
      4. 小红书标题是否 ≤20 字、正文是否 ≤1000 字

      如果内容合规可发布：在输出末尾**完整重新给出**最终版本——
      「小红书最终稿」（标题+正文+标签）和「抖音最终稿」（标题+口播稿+文案+标签），
      因为下一步发布 Agent 只会读取你的输出作为发布内容，不会回看更早的草稿。

      如果不合规：只列出问题和修改建议，不要输出可发布内容，并说明需要重新创作哪个平台的稿件。

      初稿（小红书笔记 + 抖音脚本）：
      {input}

  - name: 配图生成
    role: xiaohongshu-writer
    prompt_template: |
      根据下面已审核通过的「小红书最终稿」，调用 `image.generate_cards` 工具生成这篇笔记的配图卡片
      （真实 PNG 文件，1080x1440），然后把生成结果原样报告出来。

      卡片规划建议（6-8 张为宜）：
      - 第 1 张 `cover`：封面。tag 用垂类词，title 用最终稿标题（可精简），subtitle 放一句痛点概括。
      - 中间若干张 `point`：每个要点一张，index 用 ①②③，heading 是要点小标题，
        body 是该要点的核心说明，tip 放这一点的关键结论。
      - 可选一张 `list`：把要点或步骤做成清单页。
      - 最后一张 `end`：结尾互动页，heading 放提问，body 放互动引导。
      - 想强调的短语用 `**双星号**` 包裹，会自动渲染成高亮色。

      **重要**：
      1. 卡片文字要**从最终稿里提炼**，不要新编内容、不要引入最终稿没有的事实或数据。
      2. 每张卡片文字要短（标题≤20字、正文≤60字），卡片是给人扫读的，不是塞全文。
      3. 工具调用成功后，必须在输出末尾用「## 配图文件路径」小标题，把工具返回的
         **每一个 PNG 绝对路径逐行完整列出**，因为下一步发布 Agent 只能看到你的输出，
         拿不到路径就无法发布。
      4. 同时把「小红书最终稿」和「抖音最终稿」的完整内容一并原样带下去，理由同上。

      **可选：AI 插画**
      卡片做完后，如果时间允许，可以再调用一次 `image.generate_comfyui` 生成 **1-2 张**
      配图插画（本地 ComfyUI，约 70 秒一张），穿插在笔记里提升观感。要求：
      - prompt 必须用**英文**描述画面场景，且**绝不能要求图中出现文字**——
        扩散模型画不出可读的中文，文字一律交给上面的卡片。
      - style 一般用 `illustration`（扁平插画），生活类内容可用 `photo`。
      - 如果工具报错（例如 ComfyUI 没启动），**跳过即可**，不要重试、不要因此中断，
        卡片已经足够发布。生成成功的话，把路径一并列进「## 配图文件路径」。

      已审核通过的终稿：
      {input}

  - name: 发布执行
    role: social-publisher
    prompt_template: |
      以下是已审核通过的终稿，以及上一步已经生成好的小红书配图 PNG 绝对路径。
      请先确认终稿是唯一确定版本（不含多个备选标题等未定稿内容），再核对配图路径是否齐全。

      **重要**：本 Agent 不会自己生成或猜测图片/视频文件。
      - 小红书图文：使用上一步「配图文件路径」里给出的 PNG 绝对路径作为 images 参数。
        如果上一步没有给出任何路径，必须停止并说明缺少配图，不能编造路径。
      - 抖音视频：需要本地视频文件绝对路径；本流水线不生成视频，如果没有人工提供视频路径，
        跳过抖音发布并在输出中说明原因，不要编造路径。

      发布前必须先调用登录状态检查工具；确认无误后，调用对应平台的发布工具，
      并在输出中给出每个平台的发布结果（成功的笔记/视频链接，或失败原因）。

      终稿内容 + 配图文件路径：
      {input}
