name: Xiaohongshu Douyin Crosspost
description: >-
  知识科普/生活好物/工作方法内容的小红书+抖音双平台工作流：真实数据选题调研 → 小红书图文创作 → 抖音脚本创作 →
  合规审核 → 人工确认 → 实际发布。创建该流水线时建议将 gateMode 设为 "manual"，
  这样每个阶段结束后都会暂停等待人工点击 approve，尤其是发布执行阶段之前必须人工确认终稿。
stages:
  - name: 选题调研
    role: trend-scout
    prompt_template: |
      围绕以下主题，调研小红书和抖音两个平台的真实热度数据（用 mcp__douyin-search__search_videos、
      mcp__douyin-search__get_homefeed、mcp__xiaohongshu__search_feeds 等工具抓真实数据，不要凭空猜测）。
      内容方向限定为：知识科普 / 生活好物 / 工作方法与效率。

      输出：推荐的具体选题角度、热度证据（真实标题+互动数据）、小红书和抖音各自的差异化建议、关键词清单。

      主题：
      {input}

  - name: 小红书笔记创作
    role: xiaohongshu-writer
    prompt_template: |
      根据以下选题调研结果，创作完整的小红书图文笔记（标题、正文、配图方案、标签、发布建议）。

      选题调研结果：
      {input}

  - name: 抖音脚本创作
    role: douyin-writer
    prompt_template: |
      下面是同一批调研之后创作的小红书图文笔记完整初稿。请你：
      1. 在回答最前面，先原样完整复述一遍这份小红书笔记初稿（标题、正文、标签，不要删减或改写），
         标注小标题"【小红书笔记初稿（原样保留）】"——因为下一步"合规审核" Agent 只能看到你这一步
         的完整输出，看不到更早的草稿，如果你不带上，审核就会因为缺内容而卡住。
      2. 然后基于同样的核心观点，创作完整的抖音短视频脚本（标题、分镜脚本、口播稿、封面文案、
         标签、发布建议），表达形式按抖音平台习惯调整，标注小标题"【抖音脚本创作】"。

      小红书笔记初稿：
      {input}

  - name: 合规审核
    role: review
    prompt_template: |
      审核以下小红书笔记初稿和抖音脚本初稿，检查：
      1. 事实准确性、逻辑连贯性
      2. AI 痕迹（套话、模板感）
      3. 敏感内容 / 广告法风险 / 平台社区规范风险（虚假宣传、极限词、导流私域等）
      4. 小红书标题是否 ≤20 字、正文是否 ≤1000 字

      如果内容合规可发布：在输出末尾**完整重新给出**最终版本——
      「小红书最终稿」（标题+正文+标签）和「抖音最终稿」（标题+口播稿+文案+标签），
      因为下一步发布 Agent 只会读取你的输出作为发布内容，不会回看更早的草稿。

      如果不合规：只列出问题和修改建议，不要输出可发布内容，并说明需要重新创作哪个平台的稿件。

      初稿（小红书笔记 + 抖音脚本）：
      {input}

  - name: 发布执行
    role: social-publisher
    prompt_template: |
      以下是已审核通过的终稿。请先确认终稿是否为唯一确定版本（不含多个备选标题等未定稿内容）；
      再检查是否提供了发布所需的本地媒体文件绝对路径（小红书图文需要图片路径，视频类需要视频文件路径）。

      **重要**：本 Agent 不会自己生成或猜测图片/视频文件，如果下方内容没有明确给出本地媒体文件的
      绝对路径，必须停止并说明缺少哪些媒体文件，不能编造路径或跳过校验直接尝试发布。

      发布前必须先调用登录状态检查工具；确认无误后，调用小红书和/或抖音的发布工具，
      并在输出中给出每个平台的发布结果（成功的笔记/视频链接，或失败原因）。

      终稿内容（含媒体文件路径，若在人工确认环节补充）：
      {input}
