name: Douyin Video Publish
description: 抖音独立视频生产与人工发布流水线；只处理抖音，不生成小红书或公众号内容。需要提供真实本地视频绝对路径。
stages:
  - name: 抖音选题调研
    role: trend-scout
    prompt_template: |
      若输入包含 `GitHub Public Repository Evidence Package`，将其中 README、Release、事实快照和 evidenceUrls
      作为项目功能的唯一事实来源；Star/Fork/Issue 只标为抓取时快照，不得当成口碑或效果证明。
      只围绕抖音平台调研以下主题，不生成小红书或公众号建议。
      使用 `mcp__douyin-search__search_videos` 或 `get_homefeed` 获取真实样本；
      最多调用 8 次，同一关键词不得重复检索。
      输出目标人群、真实标题和互动字段、关键词、差异化切入点与数据限制。
      如果输入包含 `video_path`，必须原样保留该绝对路径，供后续媒体 QA 使用。
      不得编造热度、互动数字或文件路径。

      主题与视频资产：
      {input}

  - name: 抖音视频脚本
    role: douyin-writer
    depends_on: [0]
    prompt_template: |
      根据抖音调研结果生成唯一确定的视频发布包：
      - 唯一标题；
      - 0-3 秒 Hook；
      - 分镜时间、画面、口播、字幕和 B-roll；
      - 完整口播稿、封面文案、发布描述、5-10 个标签与 CTA；
      - 9:16、建议 1080x1920 的规格说明。
      如果上游包含 `video_path`，必须逐字复制到输出；不得生成或猜测路径。
      本阶段只创作脚本，不调用发布工具。

      调研结果和视频资产：
      {input}

  - name: 自动合规初筛
    role: social-compliance-reviewer
    depends_on: [1]
    output_schema: docs/social-workflow/compliance-report.schema.json
    prompt_template: |
      先调用 `content.compliance_check`，只审核以下抖音终稿。
      检查事实、极限词、广告法风险、导流、素材版权声明和前 3 秒 Hook。
      输出必须符合 `docs/social-workflow/compliance-report.schema.json`，
      findings 中的平台只允许 douyin。自动检查不能代替真人审批。

      抖音终稿：
      {input}

  - name: 人工审核材料
    role: social-review-coordinator
    depends_on: [1, 2]
    requires_approval: true
    approval_kind: content
    output_schema: docs/social-workflow/review-package.schema.json
    prompt_template: |
      将抖音唯一终稿、合规报告和原始 `video_path` 整理成人工审核包。
      platforms 数组只包含 douyin。你只能给 recommendation，不能冒充真人审批。
      输出必须符合 `docs/social-workflow/review-package.schema.json`。

      审核输入：
      {input}

  - name: 视频媒体 QA
    role: media-qa
    depends_on: [1, 3]
    output_schema: docs/social-workflow/media-qa-report.schema.json
    output_policy:
      field: status
      allowed_values: [pass]
      on_failure: blocked
      message: 抖音视频文件不存在或媒体 QA 未通过。
    prompt_template: |
      从输入读取真人已审核的 `video_path`，调用 `media.inspect` 检查真实本地视频。
      必须验证：绝对路径存在、文件可读、格式为 MP4/MOV/M4V/WebM/MKV、
      视频流与编码信息可识别、建议 9:16/1080x1920。
      缺少路径、路径不可访问或文件不存在时 status=blocked，禁止伪造替代文件。
      输出必须符合 `docs/social-workflow/media-qa-report.schema.json`，
      assets 只包含 platform=douyin、purpose=video。

      脚本、审批记录与视频路径：
      {input}

  - name: 发布预检
    role: social-preflight
    depends_on: [1, 3, 4]
    output_schema: docs/social-workflow/preflight-result.schema.json
    output_policy:
      field: ok
      allowed_values: [true]
      on_failure: blocked
      message: 抖音发布预检未通过。
    prompt_template: |
      只对抖音执行发布预检，不得发布：
      - 核对真人内容审批记录；
      - 检查唯一标题、描述和标签；
      - 调用 `mcp__douyin-upload__douyin_check_login` 检查登录；
      - 再次调用 `media.inspect` 检查同一个 `video_path`；
      - 调用 `social.schedule_check` 检查排期冲突；
      - 生成稳定幂等键。
      输出必须符合 `docs/social-workflow/preflight-result.schema.json`，
      platforms 数组只包含 douyin。任何必需项缺失时 ok=false。

      预检输入：
      {input}

  - name: 抖音视频发布
    role: social-publisher
    depends_on: [1, 3, 4, 5]
    requires_approval: true
    approval_kind: publish
    publish_tools:
      - mcp__douyin-upload__douyin_upload_video
    output_schema: docs/social-workflow/publish-result.schema.json
    prompt_template: |
      仅发布到抖音。必须确认真人审批、媒体 QA status=pass、预检 ok=true，
      且当前发布阶段已获得显式 PUBLISH 确认。
      调用 `mcp__douyin-upload__douyin_upload_video` 时只使用已审核字段：
      - videoPath：真实本地视频绝对路径；
      - title：唯一终稿标题；
      - description：唯一发布描述；
      - tags：已审核标签数组；
      - autoPublish：true。
      同一 content_id/idempotency_key 不得重复发布；不得修改文案或猜测路径。
      输出必须符合 `docs/social-workflow/publish-result.schema.json`，
      results 数组只包含 douyin。

      已审核终稿、视频 QA 与预检结果：
      {input}

  - name: 发布补偿计划
    role: social-ops
    depends_on: [6]
    output_schema: docs/social-workflow/compensation-plan.schema.json
    prompt_template: |
      根据抖音发布结果输出补偿计划。不得自动删除、撤回或重复发布。
      只有明确的临时错误才能建议一次需要真人确认的重试。

      发布结果：
      {input}

  - name: 发布后监控计划
    role: social-analytics
    depends_on: [6]
    output_schema: docs/social-workflow/performance-report.schema.json
    prompt_template: |
      若抖音发布成功，调用 `social.monitor_plan` 持久化 48、72、168 小时监控任务，
      并输出抖音 performance report 骨架。无法取得的指标标记 unavailable。

      发布结果：
      {input}
