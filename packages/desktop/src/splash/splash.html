<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Myrmecia</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
        --bg: #090b0f;
        --surface: #11141a;
        --surface-soft: #151922;
        --border: #272c37;
        --border-strong: #3b4352;
        --text: #f5f7fb;
        --muted: #9aa3b2;
        --dim: #657083;
        --accent: #8b7cff;
        --accent-soft: #8b7cff20;
        --success: #55d69e;
        --warning: #f1bc68;
        --danger: #ff858f;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: auto;
        color: var(--text);
        background:
          radial-gradient(circle at 50% -16%, #7c6cff28, transparent 34%),
          linear-gradient(180deg, #0d1016 0%, var(--bg) 48%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(#ffffff05 1px, transparent 1px);
        background-size: 100% 34px;
        mask-image: linear-gradient(to bottom, black, transparent 72%);
      }

      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button[hidden],
      #doctor[hidden],
      #runtime-config[hidden],
      #runtime-config label[hidden],
      #provider-options[hidden] { display: none !important; }

      .shell {
        position: relative;
        width: min(536px, calc(100vw - 52px));
        margin: 0 auto;
        padding: 28px 0 22px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        position: relative;
        width: 38px;
        height: 38px;
        overflow: hidden;
        border: 1px solid #ffffff26;
        border-radius: 12px;
        background: linear-gradient(145deg, #a295ff, #5cc6d0);
        box-shadow: 0 12px 34px #7669ff35;
      }

      .brand-mark::before,
      .brand-mark::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        background: #fff;
      }

      .brand-mark::before {
        width: 8px;
        height: 24px;
        left: 15px;
        top: 7px;
        box-shadow: -8px 6px 0 -2px #fff, 8px 6px 0 -2px #fff;
      }

      .brand-mark::after {
        width: 22px;
        height: 2px;
        left: 8px;
        top: 20px;
        transform: rotate(18deg);
        box-shadow: 0 6px 0 #fff;
      }

      .brand-name {
        font-size: 15px;
        font-weight: 720;
        letter-spacing: .02em;
      }

      .brand-subtitle {
        margin-top: 2px;
        color: var(--dim);
        font-size: 9px;
      }

      .runtime-badge {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 9px;
        color: #b9c0cc;
        background: #ffffff05;
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: .08em;
      }

      .intro {
        margin-top: 34px;
      }

      .eyebrow {
        color: #9d94ff;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: .15em;
        text-transform: uppercase;
      }

      .intro h1 {
        max-width: 430px;
        margin: 9px 0 0;
        font-size: 30px;
        font-weight: 690;
        letter-spacing: -.045em;
        line-height: 1.12;
      }

      .intro-copy {
        max-width: 430px;
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.65;
      }

      #status {
        display: flex;
        align-items: center;
        min-height: 20px;
        margin: 15px 0 0;
        color: #a3acba;
        font-size: 10px;
      }

      #status::before {
        content: "";
        width: 6px;
        height: 6px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 12px #55d69e70;
      }

      #status.pulse::before { animation: pulse 1.2s infinite; }
      #status.failed { color: var(--danger); }
      #status.failed::before { background: var(--danger); box-shadow: 0 0 12px #ff858f70; }

      @keyframes pulse {
        50% { opacity: .35; transform: scale(.75); }
      }

      .recovery-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      #provider-options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
        margin-top: 20px;
      }

      .provider-option {
        position: relative;
        min-height: 122px;
        padding: 13px;
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--text);
        background: linear-gradient(180deg, #161a22, #11141a);
        text-align: left;
        transition: transform .15s ease, border-color .15s ease, background .15s ease;
      }

      .provider-option:hover {
        transform: translateY(-1px);
        border-color: var(--border-strong);
      }

      .provider-option.selected {
        border-color: #8b7cff90;
        background: linear-gradient(180deg, #211f35, #151523);
        box-shadow: 0 0 0 1px #8b7cff18, 0 14px 34px #00000028;
      }

      .provider-icon {
        display: inline-flex;
        height: 29px;
        min-width: 29px;
        align-items: center;
        justify-content: center;
        border: 1px solid #ffffff12;
        border-radius: 9px;
        color: #d6d9e0;
        background: #ffffff08;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
      }

      .provider-copy,
      .provider-title,
      .provider-description,
      .provider-side { display: block; }

      .provider-eyebrow,
      .provider-tags,
      .provider-state { display: none; }

      .provider-title {
        margin-top: 12px;
        font-size: 12px;
        font-weight: 650;
      }

      .provider-description {
        min-height: 32px;
        margin-top: 5px;
        color: var(--dim);
        font-size: 9px;
        line-height: 1.55;
      }

      .provider-side {
        margin-top: 9px;
      }

      .provider-action {
        color: #a8a0ff;
        font-size: 9px;
        font-weight: 650;
      }

      #runtime-config {
        margin-top: 11px;
        padding: 15px;
        border: 1px solid var(--border);
        border-radius: 17px;
        background: #11141ad9;
        box-shadow: 0 18px 50px #00000024;
      }

      #runtime-config label {
        display: block;
        margin-bottom: 11px;
        color: #bac1cd;
        font-size: 9px;
        font-weight: 600;
      }

      #runtime-config input,
      #runtime-config select {
        width: 100%;
        margin-top: 6px;
        padding: 10px 11px;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        color: var(--text);
        background: #090c11;
        font-family: var(--mono);
        font-size: 10px;
      }

      #runtime-config input:focus,
      #runtime-config select:focus { border-color: #8b7cff90; }

      #storage-status {
        margin: 2px 0 0;
        color: var(--dim);
        font-size: 9px;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }

      .action-button,
      #doctor-button {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 12px;
        color: #c4cad4;
        background: #171b23;
        font-size: 10px;
        font-weight: 620;
      }

      .action-button:hover,
      #doctor-button:hover { border-color: var(--border-strong); color: #fff; }
      .action-button:disabled,
      #doctor-button:disabled { cursor: not-allowed; opacity: .45; }

      .action-button.primary {
        flex: 1;
        border-color: #8b7cff90;
        color: #fff;
        background: linear-gradient(135deg, #7c6cff, #6658e8);
        box-shadow: 0 10px 28px #7669ff28;
      }

      #doctor {
        max-height: 116px;
        margin: 12px 0 0;
        padding: 11px 13px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0d1015;
        list-style: none;
      }

      #doctor li {
        margin: 4px 0;
        color: var(--muted);
        font-size: 9px;
        line-height: 1.4;
      }

      #doctor li.pass { color: var(--success); }
      #doctor li.warn { color: var(--warning); }
      #doctor li.fail { color: var(--danger); }

      .footer-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 14px;
        padding-top: 13px;
        border-top: 1px solid #ffffff0d;
      }

      .footer-title {
        color: #adb5c2;
        font-size: 9px;
        font-weight: 620;
      }

      .footer-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--success);
      }

      .footer-meta {
        margin-top: 4px;
        color: #555f70;
        font-family: var(--mono);
        font-size: 7px;
        letter-spacing: .08em;
      }

      #doctor-button {
        padding: 7px 9px;
        color: var(--dim);
        background: transparent;
      }

      .legal {
        margin: 11px 0 0;
        color: #4d5665;
        font-size: 8px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>
            <span class="brand-name">Myrmecia</span>
            <span class="brand-subtitle">Local AI workspace</span>
          </span>
        </div>
        <span class="runtime-badge">LOCAL · PRIVATE</span>
      </header>

      <section class="intro">
        <div class="eyebrow">Model provider</div>
        <h1>选择模型，开始工作。</h1>
        <p class="intro-copy">连接本机 Copilot 或你自己的模型服务。凭据仅保存在当前设备，启动后仍可随时切换。</p>
        <p id="status" class="pulse" aria-live="polite">正在准备本地服务…</p>
        <div class="recovery-actions">
          <button id="retry" class="action-button" hidden>重试启动</button>
          <button id="quit" class="action-button" hidden>退出</button>
        </div>
      </section>

      <section id="provider-options" aria-label="模型 Provider" hidden>
        <button type="button" class="provider-option" data-provider-choice="copilot">
          <span class="provider-icon">GH</span>
          <span class="provider-copy">
            <span class="provider-eyebrow">01 / GitHub</span>
            <strong class="provider-title">GitHub Copilot</strong>
            <span class="provider-description">使用本机已登录账号，无需填写 API Key。</span>
            <span class="provider-tags"><span class="provider-tag">Local login</span></span>
          </span>
          <span class="provider-side"><span class="provider-state">本机凭据</span><span class="provider-action">选择 →</span></span>
        </button>

        <button type="button" class="provider-option" data-provider-choice="deepseek">
          <span class="provider-icon">DS</span>
          <span class="provider-copy">
            <span class="provider-eyebrow">02 / Direct</span>
            <strong class="provider-title">DeepSeek</strong>
            <span class="provider-description">连接官方 API，适合独立直连部署。</span>
            <span class="provider-tags"><span class="provider-tag">API key</span></span>
          </span>
          <span class="provider-side"><span class="provider-state">需要密钥</span><span class="provider-action">选择 →</span></span>
        </button>

        <button type="button" class="provider-option" data-provider-choice="openai-compatible">
          <span class="provider-icon">API</span>
          <span class="provider-copy">
            <span class="provider-eyebrow">03 / Custom</span>
            <strong class="provider-title">自定义网关</strong>
            <span class="provider-description">OpenAI-compatible、本地模型或自建服务。</span>
            <span class="provider-tags"><span class="provider-tag">Base URL</span></span>
          </span>
          <span class="provider-side"><span class="provider-state">高级配置</span><span class="provider-action">选择 →</span></span>
        </button>
      </section>

      <form id="runtime-config" hidden>
        <label id="provider-field" hidden>
          模型 Provider
          <select id="provider">
            <option value="copilot">GitHub Copilot（本机登录）</option>
            <option value="deepseek">DeepSeek API（直连）</option>
            <option value="openai-compatible">OpenAI-compatible API</option>
          </select>
        </label>
        <label id="base-url-field">
          模型 Base URL
          <input id="base-url" type="url" inputmode="url" placeholder="https://api.example.com/v1" autocomplete="url" />
        </label>
        <label id="model-field">
          模型名称
          <input id="model" type="text" placeholder="gpt-5.4-mini" autocomplete="off" />
        </label>
        <label id="api-key-field">
          API Key
          <input id="api-key" type="password" autocomplete="new-password" />
        </label>
        <p id="storage-status"></p>
        <div class="actions">
          <button id="save-config" type="submit" class="action-button primary">安全保存并启动</button>
          <button id="continue-without-config" type="button" class="action-button">仅浏览</button>
        </div>
      </form>

      <ul id="doctor" hidden></ul>

      <footer class="footer-status">
        <div>
          <div id="footer-title" class="footer-title"><span id="footer-dot" class="footer-dot"></span>本地工作区待启动</div>
          <div id="footer-meta" class="footer-meta">NODE · WORKSPACE · CREDENTIALS / LOCAL ONLY</div>
        </div>
        <button id="doctor-button" type="button">环境检查</button>
      </footer>
      <p class="legal">Python Runtime 可选 · 凭据经系统安全存储加密</p>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
