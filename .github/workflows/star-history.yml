name: Update star history

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/star-history.yml
      - scripts/generate-star-history.mjs
      - scripts/assets/**

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  generate:
    name: Generate static star chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Generate light and dark charts
        run: node scripts/generate-star-history.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated charts
        run: |
          git add docs/assets/star-history-light.svg docs/assets/star-history-dark.svg
          if git diff --cached --quiet; then
            echo "Star history is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update star history"
          git pull --rebase
          git push
