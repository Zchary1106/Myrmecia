name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing or new v* tag to receive the installers'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/desktop-build.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - 'packages/server/**'
      - 'packages/dashboard/**'
      - 'packages/python-runtime/**'
      - 'agents/**'
      - 'templates/**'
      - 'skills/**'

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installers:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS DMG
            os: macos-14
            platform: mac
            artifact: myrmecia-macos
          - label: Windows EXE
            os: windows-latest
            platform: windows
            artifact: myrmecia-windows
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MYRMECIA_REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Restore Electron cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/electron-builder-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure release signing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ matrix.platform }}" = 'mac' ]; then
            echo "CSC_LINK=$MACOS_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MACOS_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          else
            echo "CSC_LINK=$WINDOWS_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WINDOWS_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Require release signing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          if [ "${{ matrix.platform }}" = 'mac' ]; then
            test -n "$APPLE_ID"
            test -n "$APPLE_APP_SPECIFIC_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          fi

      - name: Build unsigned macOS installer
        if: matrix.platform == 'mac'
        run: pnpm --filter @myrmecia/desktop package:mac
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Build unsigned Windows installer
        if: matrix.platform == 'windows'
        run: pnpm --filter @myrmecia/desktop package:win
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Verify macOS installer
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          test -n "$(find packages/desktop/release -maxdepth 1 -name '*.dmg' -print -quit)"
          hdiutil verify packages/desktop/release/*.dmg
          app_bundle="$(find packages/desktop/release -maxdepth 3 -name '*.app' -print -quit)"
          test -n "$app_bundle"
          "$app_bundle/Contents/MacOS/Myrmecia" --smoke-test
          if [ "$MYRMECIA_REQUIRE_RELEASE_SIGNING" = 'true' ]; then
            codesign --verify --deep --strict "$app_bundle"
            xcrun stapler validate "$app_bundle"
            dmg_path="$(find packages/desktop/release -maxdepth 1 -name '*.dmg' -print -quit)"
            xcrun notarytool submit "$dmg_path" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg_path"
            xcrun stapler validate "$dmg_path"
          fi
          shasum -a 256 packages/desktop/release/*.dmg > packages/desktop/release/SHA256SUMS-macos.txt

      - name: Verify Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/desktop/release/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not generated' }
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S /currentuser' -PassThru -NoNewWindow
          $deadline = (Get-Date).AddSeconds(180)
          $app = $null
          while ((Get-Date) -lt $deadline) {
            $app = Get-ChildItem $installRoot -Filter 'Myrmecia.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($app) { break }
            if ($process.HasExited -and $process.ExitCode -ne 0) {
              throw "NSIS installer exited with code $($process.ExitCode) before installing Myrmecia.exe"
            }
            Start-Sleep -Seconds 2
          }
          if (-not $app) {
            Get-ChildItem $installRoot -Recurse -ErrorAction SilentlyContinue | Select-Object -First 100 | Format-Table FullName
            Get-Process | Where-Object { $_.ProcessName -match 'Myrmecia|Setup' } | Format-Table Id, ProcessName, Path
            throw 'NSIS installer did not install Myrmecia.exe under the per-user Programs directory'
          }
          if (-not $process.HasExited) {
            & taskkill.exe /PID $process.Id /T /F | Out-Host
            throw 'NSIS one-click installer did not exit after installing files'
          } elseif ($process.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($process.ExitCode)"
          }
          $smoke = Start-Process -FilePath $app.FullName -ArgumentList '--smoke-test' -PassThru
          if (-not $smoke.WaitForExit(120000)) {
            Stop-Process -Id $smoke.Id -Force
            throw 'Installed Myrmecia.exe did not complete its startup smoke test'
          }
          if ($smoke.ExitCode -ne 0) { throw "Installed Myrmecia.exe smoke test exited with code $($smoke.ExitCode)" }
          Get-FileHash $installer.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($installer.Name)" } | Set-Content packages/desktop/release/SHA256SUMS-windows.txt

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
            packages/desktop/release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30

  attach-to-release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build-installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: false

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::Release tag must start with v"; exit 1 ;;
          esac
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPOSITORY" --generate-notes --title "Myrmecia $TAG"
          fi
          find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name 'SHA256SUMS-*.txt' \) -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$REPOSITORY" --clobber
