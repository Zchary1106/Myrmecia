name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  require-main-base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require pull requests to target main
        run: |
          if [ "$GITHUB_BASE_REF" != "main" ]; then
            echo "::error::Pull requests must target main. Stacked PRs can appear merged without ever reaching the default branch."
            exit 1
          fi

  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm validate:contracts
      - run: pnpm validate:social-workflow
      - run: pnpm audit --prod --audit-level=high

  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myrmecia/server test

  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myrmecia/dashboard test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-build, test-server, test-dashboard]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myrmecia/dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter @myrmecia/dashboard test:e2e
        env:
          DB_PATH: ${{ runner.temp }}/myrmecia-e2e.db
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: packages/dashboard/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  desktop-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-build, test-server, test-dashboard]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @myrmecia/desktop build
      - run: pnpm --filter @myrmecia/desktop stage
      - name: Verify packaged server resources
        run: |
          test -f packages/desktop/.stage/server/dist/index.js
          test -f packages/desktop/.stage/server/desktop-runtime.json
          test -d packages/desktop/.stage/server/node_modules
